<!doctype html>
<html lang="ja">
<head>
<meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="pCloud写真">
<link rel="apple-touch-icon" href="icon-180.png">
<title>pCloud写真</title>
<style>
:root{--bg:#fff;--panel:#f4f5f6;--fg:#1a1d20;--sub:#6b7680;--line:#dde1e4;--acc:#0a7cff;--accfg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#101214;--panel:#1a1d20;--fg:#eceff1;--sub:#98a2aa;--line:#2b3136;--acc:#4da3ff;--accfg:#08131f}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Hiragino Sans","Yu Gothic",sans-serif;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-height:48px}
header h1{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header span{color:var(--sub);font-size:13px;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:0 0 12px}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{font:inherit;font-size:14px;border:0;background:none;color:var(--sub);padding:12px 4px}
nav button[aria-current="true"]{color:var(--acc);font-weight:600}
button{font:inherit}
.btn{border:1px solid var(--line);background:none;color:var(--acc);border-radius:8px;padding:8px 14px}
.btn.main{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.pad{padding:12px 16px}
.note{color:var(--sub);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
.chips button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:999px;padding:2px 12px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding-top:10px}
.grid .c{aspect-ratio:1;position:relative;overflow:hidden;background:var(--panel);border:0;padding:0}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .c{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#pm{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:50}
#pm .sh{background:var(--bg);color:var(--fg);width:100%;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));border-radius:14px 14px 0 0}
#pm .sh button{display:block;width:100%;margin:6px 0;padding:12px;font-size:16px}
#pm .info{font-size:14px;line-height:1.7;word-break:break-all;white-space:pre-wrap;margin:4px 0 8px}
#cmp{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:60;padding-top:env(safe-area-inset-top,0px)}
#cmp .ctop{display:flex;align-items:center;gap:10px;padding:8px 12px}
#cmp .gl{position:absolute;inset:0;pointer-events:none;z-index:3}
#cmp .gl i{position:absolute;left:4px;right:4px;border-top:1px dashed #ff3b30cc}
#cmp .gl b{position:absolute;top:0;bottom:0;border-left:1px dashed #ff3b3099}
#cmp #cgl[aria-pressed="true"]{background:var(--acc);color:var(--accfg)}
#cmp .cpan{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 4px}
#cmp .pn{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--panel);touch-action:none}
#cmp .pn img{position:absolute;left:50%;top:50%;transform-origin:center;pointer-events:none;max-width:none}
#cmp .lb{position:absolute;left:6px;top:6px;z-index:2;background:#000a;color:#fff;font-size:12px;padding:1px 8px;border-radius:999px}
#cmp .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
#cmp .cctl{padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#cmp .cbtns{display:flex;gap:8px;margin-top:8px}#cmp .cbtns .btn{flex:1;padding:10px 6px}
#cam{position:fixed;inset:0;background:#000;display:none;z-index:70}
#cam .cfr video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam .cfr #cov{position:absolute;left:50%;top:50%;max-width:none}
#cam #cov{pointer-events:none;transform-origin:center}
#cam .cbar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0006}
#cam #shot{width:70px;height:70px;border-radius:50%;border:5px solid #fff;background:#fff6}
.grid .dh{grid-column:1/-1;padding:14px 8px 6px;font-weight:bold;font-size:15px}
.badge{position:absolute;right:3px;bottom:3px;background:#000b;color:#fff;font-size:11px;padding:0 5px;border-radius:4px}
.row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.row input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.row button.name{flex:1;min-width:0;text-align:left;border:0;background:none;color:var(--fg);padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--sub)}
input[type=text]{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#viewer{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:10}
#viewer img,#viewer video{max-width:100%;max-height:100%}
#viewer .x,#viewer .p,#viewer .n{position:absolute;background:#0008;color:#fff;border:0;border-radius:999px;width:44px;height:44px;font-size:20px}
#viewer .x{top:calc(12px + env(safe-area-inset-top,0px));right:12px}
#viewer .p{left:8px;top:50%}
#viewer .n{right:8px;top:50%}
#viewer .acts{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;display:flex;gap:8px}
#viewer .acts button{background:#0008;color:#fff;border:0;border-radius:999px;height:44px;padding:0 16px;font-size:14px}
#viewer .t{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:12px}
</style>
</head>
<body>
<header><h1 id="title">pCloud写真</h1><span id="count"></span></header>
<main id="main"></main>
<nav>
  <button id="t-photos">写真</button>
  <button id="t-folders">フォルダ</button>
  <button id="t-settings">設定</button>
</nav>
<div id="viewer"><button class="x" id="vx" aria-label="閉じる">✕</button><button class="p" id="vp" aria-label="前へ">‹</button><button class="n" id="vn" aria-label="次へ">›</button><div class="t" id="vt"></div><div class="acts"><button id="vs">保存</button><button id="vd">ゴミ箱</button></div></div>

<script>
// ---------- 保存（このブラウザの中だけ） ----------
const S={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let cfg={clientId:S.get('cid','p3yyOitV43F'),token:S.get('tok',''),host:S.get('host','api.pcloud.com'),folders:[]};
try{cfg.folders=JSON.parse(S.get('folders','[]'))||[]}catch(e){cfg.folders=[]}
const $=s=>document.querySelector(s), main=$('#main');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- ログイン（パスワードは、このページでは扱わない） ----------
if(location.hash.includes('access_token')){
  const p=new URLSearchParams(location.hash.slice(1));
  S.set('tok',p.get('access_token')||'');S.set('host',p.get('hostname')||'api.pcloud.com');
  cfg.token=S.get('tok');cfg.host=S.get('host');history.replaceState(null,'',location.pathname);
}
function login(){
  const redirect=location.origin+location.pathname;
  location.href='https://my.pcloud.com/oauth2/authorize?client_id='+encodeURIComponent(cfg.clientId)+'&response_type=token&redirect_uri='+encodeURIComponent(redirect);
}
function logout(){S.set('tok','');cfg.token='';go('settings')}

// ---------- API ----------
async function api(method,params){
  const u=new URL('https://'+cfg.host+'/'+method);
  u.searchParams.set('access_token',cfg.token);
  for(const k in params)u.searchParams.set(k,params[k]);
  const r=await (await fetch(u,{referrerPolicy:'no-referrer'})).json();
  if(r.result!==0){const e=new Error(r.error||('error '+r.result));e.code=r.result;throw e}
  return r;
}
const IMG=/\.(heic|heif|jpe?g|png|gif|webp)$/i, VID=/\.(mov|mp4|m4v)$/i;
function kind(f){ if(f.category===1||IMG.test(f.name))return 'i'; if(f.category===2||VID.test(f.name))return 'v'; return ''; }

// ---------- 状態 ----------
let tab='photos', items=[], loaded=false, loading=false, loadErr='';
let ftype='all', ffolder=-1, shown=60, list=[];
let browse='/', thumbs=new Map();

function go(t){tab=t;render()}
$('#t-photos').onclick=()=>go('photos');$('#t-folders').onclick=()=>go('folders');$('#t-settings').onclick=()=>go('settings');
function setNav(){['photos','folders','settings'].forEach(t=>$('#t-'+t).setAttribute('aria-current',String(tab===t)))}

// ---------- 写真（選んだフォルダの下を、全部まとめて） ----------
async function loadAll(){
  loading=true;loadErr='';items=[];loaded=false;render();
  try{
    for(let fi=0;fi<cfg.folders.length;fi++){
      $('#count').textContent='読み込み中 '+(fi+1)+'/'+cfg.folders.length;
      const r=await api('listfolder',{path:cfg.folders[fi],recursive:1});
      (function walk(c,base){(c||[]).forEach(f=>{
        if(f.isfolder)walk(f.contents,base.replace(/[/]$/,'')+'/'+f.name);
        else{const k=kind(f);if(k)items.push({id:f.fileid,name:f.name,t:Date.parse(f.modified)||0,c:Date.parse(f.created)||0,size:f.size||0,dir:base,v:k==='v',fi})}
      })})(r.metadata.contents,cfg.folders[fi]);
    }
    items.sort((a,b)=>b.t-a.t);loaded=true;
  }catch(e){loadErr=e.message;if([1000,2000,2094,2095].includes(e.code)){S.set('tok','');cfg.token=''}}
  loading=false;shown=60;render();
}
function dayLabel(t){if(!t)return '日付なし';const d=new Date(t);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+'日月火水木金土'[d.getDay()]+'）'}
function renderPhotos(){
  $('#title').textContent='写真';
  if(!cfg.folders.length){main.innerHTML='<div class="pad"><p>見るフォルダが、まだ選ばれていません。</p><p><button class="btn main" id="gof">フォルダを選ぶ</button></p></div>';$('#gof').onclick=()=>go('folders');$('#count').textContent='';return}
  if(loading){main.innerHTML='<p class="pad note">読み込み中…（枚数が多いと、少しかかります）</p>';return}
  if(loadErr){main.innerHTML='<div class="pad"><p>失敗しました：'+esc(loadErr)+'</p><p><button class="btn" id="retry">もう一度</button> <button class="btn" id="gos">設定へ</button></p></div>';$('#retry').onclick=loadAll;$('#gos').onclick=()=>go('settings');return}
  if(!loaded){loadAll();return}
  const inF=items.filter(i=>ffolder<0||i.fi===ffolder);
  const nImg=inF.filter(i=>!i.v).length, nVid=inF.length-nImg;
  $('#count').textContent='写真 '+nImg+'枚・動画 '+nVid+'本';
  list=inF.filter(i=>ftype==='all'||(ftype==='v'?i.v:!i.v));
  const chips='<div class="chips">'+
    [['all','すべて'],['i','写真'],['v','動画']].map(a=>'<button data-ty="'+a[0]+'" aria-pressed="'+(ftype===a[0])+'">'+a[1]+'</button>').join('')+
    (cfg.folders.length>1?'<button data-fo="-1" aria-pressed="'+(ffolder<0)+'">全フォルダ</button>'+cfg.folders.map((p,i)=>'<button data-fo="'+i+'" aria-pressed="'+(ffolder===i)+'">'+esc(p.split('/').pop()||p)+'</button>').join(''):'')+'</div>';
  const part=list.slice(0,shown);
  main.innerHTML=chips+'<div class="grid">'+part.map((t,i)=>{const d=dayLabel(t.t),h=(i===0||dayLabel(part[i-1].t)!==d)?'<div class="dh">'+d+'</div>':'';return h+'<button class="c" data-i="'+i+'" aria-label="'+(t.v?'動画':'写真')+'"><span></span>'+(t.v?'<span class="badge">▶</span>':'')+'</button>'}).join('')+'</div>'+
    (list.length>shown?'<div class="pad"><button class="btn" id="more">もっと見る（残り '+(list.length-shown)+'）</button></div>':'')+
    (list.length?'':'<p class="pad note">該当するものがありません。</p>');
  main.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{ftype=b.dataset.ty;shown=60;render()});
  main.querySelectorAll('[data-fo]').forEach(b=>b.onclick=()=>{ffolder=+b.dataset.fo;shown=60;render()});
  main.querySelectorAll('.c').forEach(b=>{
    let tm=null,lp=false;const i=+b.dataset.i;
    b.addEventListener('touchstart',()=>{lp=false;tm=setTimeout(()=>{lp=true;openMenu(i)},500)},{passive:true});
    ['touchend','touchmove','touchcancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(tm),{passive:true}));
    b.addEventListener('contextmenu',e=>{e.preventDefault();if(!lp)openMenu(i)});
    b.onclick=e=>{if(lp){lp=false;e.preventDefault();return}openViewer(i)};
  });
  const m=$('#more');
  if(m){
    m.onclick=()=>{shown+=60;render()};
    // 下までスクロールしたら、自動で続きを読む
    const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)&&tab==='photos'){io.disconnect();shown+=60;render()}},{rootMargin:'600px'});
    io.observe(m);
  }
  fillThumbs(part);
}
async function fillThumbs(part){
  const need=part.filter(t=>!thumbs.has(t.id)).map(t=>t.id);
  const apply=()=>main.querySelectorAll('.c').forEach(b=>{const t=list[+b.dataset.i];const u=t&&thumbs.get(t.id);if(u&&!b.querySelector('img'))b.firstChild.outerHTML='<img loading="lazy" alt="" src="'+u+'">'});
  apply();
  for(let i=0;i<need.length;i+=50){
    try{
      const r=await api('getthumbslinks',{fileids:need.slice(i,i+50).join(','),size:'512x512',crop:1,type:'jpg'});
      (r.thumbs||[]).forEach(t=>{if(t.result===0&&t.hosts&&t.hosts.length)thumbs.set(t.fileid,'https://'+t.hosts[0]+t.path)});
      apply();
    }catch(e){}
  }
}

// ---------- 長押しメニュー（詳細・削除） ----------
function fmtT(t){if(!t)return '不明';const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
function fmtSize(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB'}
function openMenu(i){
  const t=list[i];if(!t)return;
  let pm=$('#pm');if(!pm){pm=document.createElement('div');pm.id='pm';document.body.appendChild(pm);pm.onclick=e=>{if(e.target===pm)pm.style.display='none'}}
  pm.innerHTML='<div class="sh"><div class="info" id="pmi" style="display:none"></div>'+(t.v?'':'<button class="btn main" id="pmb">前回の写真にして比べる</button>')+'<button class="btn" id="pms">iPhoneに保存</button><button class="btn" id="pmd">詳細</button><button class="btn" id="pmx" style="color:#e44">削除（pCloudのゴミ箱へ）</button><button class="btn" id="pmc">閉じる</button></div>';
  pm.style.display='flex';
  $('#pmc').onclick=()=>pm.style.display='none';
  $('#pms').onclick=()=>saveCur(i,$('#pms'),'iPhoneに保存',$('#pmi'));
  if($('#pmb'))$('#pmb').onclick=()=>{pm.style.display='none';openCompare(t)};
  $('#pmd').onclick=()=>{const x=$('#pmi');x.style.display='block';x.textContent='名前：'+t.name+'\n種類：'+(t.v?'動画':'写真')+'\n日付：'+fmtT(t.t)+(t.c&&t.c!==t.t?'\n作成：'+fmtT(t.c):'')+'\n大きさ：'+fmtSize(t.size)+'\n場所：'+(t.dir||'')};
  $('#pmx').onclick=async()=>{
    if(!confirm('「'+t.name+'」を、pCloudのゴミ箱へ移しますか？（pCloudのゴミ箱から戻せます）'))return;
    try{await api('deletefile',{fileid:t.id});items=items.filter(x=>x.id!==t.id);list=list.filter(x=>x.id!==t.id);pm.style.display='none';render()}
    catch(e){const x=$('#pmi');x.style.display='block';x.textContent='消せませんでした：'+e.message}
  };
}

// ---------- 全画面で見る ----------
let vi=0;
async function openViewer(i){
  vi=i;const t=list[i];if(!t)return;
  const v=$('#viewer');v.style.display='flex';
  v.querySelectorAll('img,video').forEach(e=>e.remove());
  $('#vt').textContent=(i+1)+' / '+list.length+'　'+t.name;
  try{
    let url;
    if(t.v){
      // pCloudは、よそのサイトからの動画リンクを断るので、中継役（Cloudflare Worker）を通す
      url='https://pcloud-photos-proxy.cyber-skiep.workers.dev/video?host='+encodeURIComponent(cfg.host)+'&token='+encodeURIComponent(cfg.token)+'&fileid='+t.id;
    }else{
      const r=await api('getthumbslinks',{fileids:t.id,size:'2048x1024',type:'jpg'});
      const th=(r.thumbs||[])[0];
      if(!th||th.result!==0)throw new Error((th&&th.error)||'リンクが取れません');
      url='https://'+th.hosts[0]+th.path;
    }
    if(vi!==i)return;
    const el=document.createElement(t.v?'video':'img');
    el.referrerPolicy='no-referrer';el.src=url;if(t.v){el.controls=true;el.playsInline=true;el.autoplay=true}
    v.insertBefore(el,v.firstChild);
  }catch(e){$('#vt').textContent='読み込めませんでした：'+e.message}
}
function closeViewer(){const v=$('#viewer');v.querySelectorAll('video').forEach(e=>e.pause());v.querySelectorAll('img,video').forEach(e=>e.remove());v.style.display='none'}
$('#vx').onclick=closeViewer;

// ---------- 保存（iPhone：共有画面 → 画像を保存／PC：ダウンロード） ----------
const PROXY='https://pcloud-photos-proxy.cyber-skiep.workers.dev/video';
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let ready=null; // iPhoneで、読み込みに時間がかかり共有を断られたときの、取り置き
async function saveCur(idx,bb,lab,err){
  const t=list[typeof idx==='number'?idx:vi];if(!t)return;const b=bb||$('#vs');const L=lab||'保存';const E=err||$('#vt');
  try{
    let file=ready&&ready.id===t.id?ready.file:null;
    if(!file){
      b.textContent='…';
      const res=await fetch(PROXY+'?host='+encodeURIComponent(cfg.host)+'&token='+encodeURIComponent(cfg.token)+'&fileid='+t.id);
      if(!res.ok)throw new Error(await res.text());
      const blob=await res.blob();
      file=new File([blob],t.name,{type:blob.type||(t.v?'video/quicktime':'image/jpeg')});
    }
    if(isIOS&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});ready=null;b.textContent=L}
      catch(e){if(e.name==='NotAllowedError'){ready={id:t.id,file};b.textContent='もう一度押す'}else{b.textContent=L}}
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=t.name;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);b.textContent=L;
    }
  }catch(e){b.textContent=L;E.style.display='block';E.textContent='保存できませんでした：'+e.message}
}
$('#vs').onclick=()=>saveCur();

// ---------- ビフォーアフター（比較） ----------
// 前回＝pCloudの写真、今回＝アプリの中のカメラ or iPhoneのカメラ・写真から。指で位置合わせ → 1枚にして保存
const cmp={before:null,after:null,bt:null,label:'',pan:[{x:0,y:0,s:1},{x:0,y:0,s:1}]};
async function loadBeforeImg(t){
  // 保存用は、元のファイル（高画質）を中継役から。開けなければ（PCでHEICなど）サムネイル
  try{const res=await fetch(PROXY+'?host='+encodeURIComponent(cfg.host)+'&token='+encodeURIComponent(cfg.token)+'&fileid='+t.id);
    if(res.ok)return await blobImg(await res.blob())}catch(e){}
  const r=await api('getthumbslinks',{fileids:t.id,size:'2048x1024',type:'jpg'});const th=(r.thumbs||[])[0];
  if(!th||th.result!==0)throw new Error((th&&th.error)||'リンクが取れません');
  const res=await fetch('https://'+th.hosts[0]+th.path,{referrerPolicy:'no-referrer'});if(!res.ok)throw new Error('サムネイルを取れません');
  return blobImg(await res.blob());
}
function blobImg(blob){return new Promise((ok,ng)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>ng(new Error('画像を開けません'));im.src=URL.createObjectURL(blob)})}
async function openCompare(t){
  let c=$('#cmp');
  if(!c){c=document.createElement('div');c.id='cmp';document.body.appendChild(c)}
  c.style.display='flex';
  c.innerHTML='<div class="ctop"><button class="btn" id="cx">✕ 閉じる</button><span class="note">版 11/19-i</span><span class="note" id="cmsg">前回の写真を読み込み中…</span></div>'+
    '<div class="cpan"><div class="pn" data-p="0"><span class="lb">前回</span></div><div class="pn" data-p="1"><span class="lb">今回</span><div class="ph">↓ 今回の写真を撮る</div></div></div>'+
    '<div class="cctl"><input type="text" id="clab" placeholder="例：施術3回目">'+
    '<div class="cbtns"><button class="btn main" id="ccam">アプリで撮る（重ねて）</button><button class="btn" id="cpick">iPhoneのカメラ・写真から</button></div>'+
    '<div class="cbtns"><button class="btn" id="cgl">補助線</button><button class="btn" id="cau">顔で合わせる</button><button class="btn" id="crs">位置を戻す</button><button class="btn main" id="csave">1枚にして送る・保存</button></div>'+
    '<p class="note">写真は、1本指で動かす・2本指で拡大縮小できます。</p><input type="file" accept="image/*" id="cfile" hidden></div>';
  cmp.before=null;cmp.after=null;cmp.bt=t.t;cmp.pan=[{x:0,y:0,s:1},{x:0,y:0,s:1}];
  $('#clab').value=cmp.label;$('#clab').oninput=e=>{cmp.label=e.target.value;cmp.pending=null};
  $('#cx').onclick=()=>{c.style.display='none'};
  $('#cpick').onclick=()=>$('#cfile').click();
  $('#cfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{setAfter(await blobImg(f))}catch(er){$('#cmsg').textContent=er.message}};
  $('#ccam').onclick=openCam;
  const gl=document.createElement('div');gl.className='gl';
  gl.innerHTML=[1,2,3,4,5].map(i=>'<i style="top:'+(i*100/6)+'%"></i>').join('')+'<b style="left:25%"></b><b style="left:75%"></b>';
  c.querySelector('.cpan').appendChild(gl);
  const gOn=S.get('guide','1')==='1';gl.style.display=gOn?'block':'none';$('#cgl').setAttribute('aria-pressed',gOn);
  $('#cgl').onclick=()=>{const on=gl.style.display==='none';gl.style.display=on?'block':'none';$('#cgl').setAttribute('aria-pressed',on);S.set('guide',on?'1':'0')};
  $('#cau').onclick=autoAlign;
  $('#crs').onclick=()=>{cmp.pan=[{x:0,y:0,s:1},{x:0,y:0,s:1}];drawPanels()};
  $('#csave').onclick=saveCompare;
  c.querySelectorAll('.pn').forEach(p=>attachPan(p,+p.dataset.p));
  // 表示用はサムネイルのリンクをそのまま使う（速い）。保存用（加工できる画像）は裏で取っておく
  cmp.clean=loadBeforeImg(t);cmp.clean.catch(()=>{});
  try{
    const r=await api('getthumbslinks',{fileids:t.id,size:'2048x1024',type:'jpg'});const th=(r.thumbs||[])[0];
    if(!th||th.result!==0)throw new Error((th&&th.error)||'リンクが取れません');
    const im=new Image();im.referrerPolicy='no-referrer';
    await new Promise((ok,ng)=>{im.onload=ok;im.onerror=()=>ng(new Error('画像を開けません'));im.src='https://'+th.hosts[0]+th.path});
    cmp.before=im;
  }catch(e){try{cmp.before=await cmp.clean}catch(e2){$('#cmsg').textContent='前回の写真を読めませんでした：'+e2.message;return}}
  $('#cmsg').textContent='前回：'+fmtT(t.t);drawPanels();
  if(cmp.ovDraw)cmp.ovDraw();
}
function setAfter(im){cmp.after=im;cmp.pan[1]={x:0,y:0,s:1};const ph=document.querySelector('#cmp .ph');if(ph)ph.remove();drawPanels();autoAlign()}
function drawPanels(){
  cmp.pending=null;cmp.saved='';
  document.querySelectorAll('#cmp .pn').forEach(p=>{
    const k=+p.dataset.p, im=k?cmp.after:cmp.before;let el=p.querySelector('img');
    if(!im){if(el)el.remove();return}
    if(!el||el.src!==im.src){if(el)el.remove();el=document.createElement('img');el.src=im.src;el.draggable=false;p.insertBefore(el,p.firstChild)}
    const pw=p.clientWidth,ph=p.clientHeight,s0=Math.max(pw/im.naturalWidth,ph/im.naturalHeight),q=cmp.pan[k];
    // 余白が出ないように：縮小は枠いっぱいまで、移動は写真の端が枠の端に来るまで
    q.s=Math.max(1,q.s);const mx=(im.naturalWidth*s0*q.s-pw)/2,my=(im.naturalHeight*s0*q.s-ph)/2;
    q.x=Math.max(-mx,Math.min(mx,q.x));q.y=Math.max(-my,Math.min(my,q.y));
    el.style.width=im.naturalWidth*s0+'px';el.style.height=im.naturalHeight*s0+'px';
    el.style.transform='translate(-50%,-50%) translate('+q.x+'px,'+q.y+'px) scale('+q.s+')';
  });
}
function attachPan(p,k){
  const pts=new Map();let st=null;
  const snap=()=>{const a=[...pts.values()];const q=cmp.pan[k];
    st={x:q.x,y:q.y,s:q.s,cx:a.reduce((m,v)=>m+v.x,0)/a.length,cy:a.reduce((m,v)=>m+v.y,0)/a.length,d:a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0}};
  p.addEventListener('pointerdown',e=>{p.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});snap()});
  p.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const a=[...pts.values()],cx=a.reduce((m,v)=>m+v.x,0)/a.length,cy=a.reduce((m,v)=>m+v.y,0)/a.length,q=cmp.pan[k];
    q.x=st.x+(cx-st.cx);q.y=st.y+(cy-st.cy);
    if(a.length>1&&st.d)q.s=Math.min(5,Math.max(0.3,st.s*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/st.d));
    drawPanels()});
  const up=e=>{pts.delete(e.pointerId);if(pts.size)snap()};
  p.addEventListener('pointerup',up);p.addEventListener('pointercancel',up);
  p.addEventListener('wheel',e=>{e.preventDefault();const q=cmp.pan[k];q.s=Math.min(5,Math.max(0.3,q.s*(e.deltaY<0?1.05:0.95)));drawPanels()},{passive:false});
}
async function saveCompare(){
  if(!cmp.before||!cmp.after){$('#cmsg').textContent='前回と今回の、両方の写真が要ります';return}
  // 作った画像が残っていれば（iPhoneに一度断られたとき）、作り直さずにすぐ共有する
  if(cmp.pending)return shareCompare(cmp.pending);
  const p=document.querySelector('#cmp .pn'),pw=p.clientWidth,ph=p.clientHeight;
  const W=1600,H=Math.round(W*ph/pw),bar=196,k=W/pw,F=W/900; // 片側 横1600px（高画質）
  const cv=document.createElement('canvas');cv.width=W*2+12;cv.height=H+bar;const g=cv.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);
  $('#cmsg').textContent='画像を作っています…';
  let clean;try{clean=await cmp.clean}catch(e){$('#cmsg').textContent='前回の写真を保存用に読めませんでした：'+e.message;return}
  [clean,cmp.after].forEach((im,i)=>{
    const s0=Math.max(pw/im.naturalWidth,ph/im.naturalHeight),q=cmp.pan[i],ox=i*(W+12);
    g.save();g.beginPath();g.rect(ox,0,W,H);g.clip();
    g.translate(ox+W/2+q.x*k,H/2+q.y*k);g.scale(s0*q.s*k,s0*q.s*k);g.drawImage(im,-im.naturalWidth/2,-im.naturalHeight/2);g.restore();
  });
  const d=t=>{const x=new Date(t);return x.getFullYear()+'/'+(x.getMonth()+1)+'/'+x.getDate()};
  g.fillStyle='#222';g.font='bold '+Math.round(40*F)+'px -apple-system,"Hiragino Sans",sans-serif';g.textAlign='center';
  g.fillText('前回 '+(cmp.bt?d(cmp.bt):''),W/2,H+50*F);g.fillText('今回 '+d(Date.now()),W+12+W/2,H+50*F);
  if(cmp.label){g.font='bold '+Math.round(36*F)+'px -apple-system,"Hiragino Sans",sans-serif';g.fillText(cmp.label,cv.width/2,H+98*F)}
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));
  const n=new Date(),pad=x=>String(x).padStart(2,'0');
  const file=new File([blob],'before-after_'+n.getFullYear()+pad(n.getMonth()+1)+pad(n.getDate())+'_'+pad(n.getHours())+pad(n.getMinutes())+'.jpg',{type:'image/jpeg'});
  // pCloudに記録を残す（裏で。共有の画面は待たない）
  cmp.pending=file;
  uploadRec(file).then(()=>{cmp.saved='pCloudの「'+REC+'」に記録しました'},e=>{cmp.saved='pCloudへの記録に失敗：'+e.message}).finally(()=>{const m=$('#cmsg');if(m)m.textContent=cmp.saved});
  return shareCompare(file);
}
const REC='Bereju_ビフォーアフター';
async function uploadRec(file){
  await api('createfolderifnotexists',{path:'/'+REC});
  const u=new URL('https://'+cfg.host+'/uploadfile');
  u.searchParams.set('access_token',cfg.token);u.searchParams.set('path','/'+REC);u.searchParams.set('filename',file.name);u.searchParams.set('nopartial','1');
  const fd=new FormData();fd.append('file',file,file.name);
  const r=await (await fetch(u,{method:'POST',body:fd,referrerPolicy:'no-referrer'})).json();
  if(r.result!==0)throw new Error(r.error||('error '+r.result));
}
async function shareCompare(file){
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});cmp.pending=null;$('#cmsg').textContent=cmp.saved||'送りました'}
    catch(e){$('#cmsg').textContent=e.name==='NotAllowedError'?'もう一度「1枚にして送る・保存」を押してください':'送るのをやめました（pCloudには記録済み）'}
  }else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);cmp.pending=null}
}
// アプリの中のカメラ：前回の写真を半透明で重ねて撮る
let camStream=null;
async function openCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('このブラウザでは、アプリの中のカメラを使えません');return}
  let w=$('#cam');if(!w){w=document.createElement('div');w.id='cam';document.body.appendChild(w)}
  w.innerHTML='<div class="cfr"><video playsinline autoplay muted></video><img alt="" id="cov"></div><div class="cbar"><button class="btn" id="camx">やめる</button>'+
    '<label class="note" style="color:#fff">重ね <input type="range" id="cop" min="0" max="100" value="40"></label><button id="shot" aria-label="撮る"></button></div>';
  w.style.display='block';
  // 枠：比較画面の枠と同じ形。左で合わせた前回の写真を、そのままの見え方で重ねる
  const pn0=document.querySelector('#cmp .pn'),pw=pn0.clientWidth,ph=pn0.clientHeight;
  const fr=w.querySelector('.cfr'),bh=w.querySelector('.cbar').offsetHeight,AW=w.clientWidth,AH=w.clientHeight-bh;
  let fw=AW,fh=AW*ph/pw;if(fh>AH){fh=AH;fw=AH*pw/ph}
  fr.style.cssText='position:absolute;left:'+(AW-fw)/2+'px;top:'+(AH-fh)/2+'px;width:'+fw+'px;height:'+fh+'px;overflow:hidden;outline:2px solid #fff8';
  const wt=document.createElement('div');wt.textContent='カメラを起動中…';wt.style.cssText='position:absolute;top:45%;left:0;right:0;text-align:center;color:#fff';w.appendChild(wt);
  w.querySelector('video').addEventListener('playing',()=>wt.remove(),{once:true});
  const ov=$('#cov'),r=fw/pw;ov.style.opacity=.4;
  cmp.ovDraw=()=>{const im=cmp.before;if(!im||!$('#cov'))return;ov.src=im.src;const s0=Math.max(fw/im.naturalWidth,fh/im.naturalHeight),q=cmp.pan[0];
    ov.style.width=im.naturalWidth*s0+'px';ov.style.height=im.naturalHeight*s0+'px';
    ov.style.transform='translate(-50%,-50%) translate('+q.x*r+'px,'+q.y*r+'px) scale('+q.s+')'};
  cmp.ovDraw();
  $('#cop').oninput=e=>ov.style.opacity=e.target.value/100;
  $('#camx').onclick=closeCam;
  // 外カメラ（environment）／インカメラ（user）を切り替える。最後に使ったほうを覚える
  const fb=document.createElement('button');fb.className='btn';fb.style.cssText='color:#fff;border-color:#fff8';
  w.querySelector('.cbar').insertBefore(fb,$('#shot'));
  const start=async()=>{
    const fm=S.get('facing','environment');fb.textContent=fm==='user'?'外カメラへ':'インカメラへ';
    if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}
    try{
      camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:fm,width:{ideal:1920},height:{ideal:1440}},audio:false});
      w.querySelector('video').srcObject=camStream;return true;
    }catch(e){closeCam();alert('カメラを使えませんでした：'+e.name+' '+e.message);return false}
  };
  fb.onclick=()=>{S.set('facing',S.get('facing','environment')==='user'?'environment':'user');start()};
  if(!await start())return;
  $('#shot').onclick=()=>{
    const v=w.querySelector('video'),vw=v.videoWidth,vh=v.videoHeight;if(!vw)return;
    // 枠に見えている範囲だけを撮る＝比較画面の右に、そのままの見え方で入る
    const s=Math.max(fw/vw,fh/vh),cw=fw/s,ch=fh/s;
    const cv=document.createElement('canvas');cv.width=Math.round(cw);cv.height=Math.round(ch);
    cv.getContext('2d').drawImage(v,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,cv.width,cv.height);
    cv.toBlob(async b=>{closeCam();setAfter(await blobImg(b))},'image/jpeg',0.95);
  };
}
// ---------- 顔で自動の位置合わせ（目の位置と幅を、左の写真にそろえる） ----------
let flP=null;
function getFL(){
  if(!flP){flP=(async()=>{
    const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const vision=await import(V+'/vision_bundle.mjs');
    const fs=await vision.FilesetResolver.forVisionTasks(V+'/wasm');
    return vision.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'},runningMode:'IMAGE',numFaces:1});
  })();flP.catch(()=>{flP=null})}
  return flP;
}
async function eyes(im){
  const fl=await getFL(),res=fl.detect(im),L=res.faceLandmarks&&res.faceLandmarks[0];if(!L)return null;
  const W=im.naturalWidth,H=im.naturalHeight,c=(a,b)=>({x:(L[a].x+L[b].x)/2*W,y:(L[a].y+L[b].y)/2*H});
  return [c(33,133),c(362,263)];
}
async function autoAlign(){
  if(!cmp.after)return;const m=$('#cmsg');m.textContent='顔を探して合わせています…（初回は少しかかります）';
  try{
    const clean=await cmp.clean,be=await eyes(clean),ae=await eyes(cmp.after);
    if(!be||!ae){m.textContent='顔が見つかりませんでした。手で合わせてください';return}
    const p=document.querySelector('#cmp .pn'),pw=p.clientWidth,ph=p.clientHeight;
    const sc=im=>Math.max(pw/im.naturalWidth,ph/im.naturalHeight);
    const scr=(im,q,pt)=>{const s=sc(im)*q.s;return{x:(pt.x-im.naturalWidth/2)*s+q.x,y:(pt.y-im.naturalHeight/2)*s+q.y}};
    const A=cmp.after,fit=()=>{
      const B=be.map(pt=>scr(clean,cmp.pan[0],pt));
      const db=Math.hypot(B[1].x-B[0].x,B[1].y-B[0].y),da=Math.hypot(ae[1].x-ae[0].x,ae[1].y-ae[0].y),s0a=sc(A),s=db/(da*s0a);
      const am={x:(ae[0].x+ae[1].x)/2,y:(ae[0].y+ae[1].y)/2},bm={x:(B[0].x+B[1].x)/2,y:(B[0].y+B[1].y)/2};
      return{s,x:bm.x-(am.x-A.naturalWidth/2)*s0a*s,y:bm.y-(am.y-A.naturalHeight/2)*s0a*s}};
    let f=fit();
    // 今回の顔のほうが大きいときは、余白を出さないように、左（前回）を拡大してそろえる
    if(f.s<1){const k=1/f.s,qb=cmp.pan[0];qb.s*=k;qb.x*=k;qb.y*=k;drawPanels();f=fit()}
    cmp.pan[1]={x:f.x,y:f.y,s:f.s};drawPanels();
    m.textContent='顔の位置を合わせました（手で微調整できます）';
  }catch(e){m.textContent='自動で合わせられませんでした：'+e.message}
}
function closeCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}const w=$('#cam');if(w)w.style.display='none'}

// ---------- ゴミ箱（pCloudのゴミ箱へ。あとで戻せる） ----------

}
$('#vd').onclick=trashCur;
$('#vp').onclick=()=>{if(vi>0)openViewer(vi-1)};
$('#vn').onclick=()=>{if(vi<list.length-1)openViewer(vi+1)};
document.addEventListener('keydown',e=>{if($('#viewer').style.display==='flex'){if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')$('#vp').click();if(e.key==='ArrowRight')$('#vn').click()}});

// ---------- フォルダ（見るフォルダの選択） ----------
async function renderFolders(){
  $('#title').textContent=browse==='/'?'フォルダ':browse.split('/').pop();
  $('#count').textContent='';
  main.innerHTML='<p class="pad note">読み込み中…</p>';
  try{
    const r=await api('listfolder',{path:browse,nofiles:1});
    const fs=(r.metadata.contents||[]).filter(f=>f.isfolder).sort((a,b)=>a.name.localeCompare(b.name));
    const full=n=>(browse==='/'?'':browse)+'/'+n;
    main.innerHTML=(browse!=='/'?'<div class="row"><button class="btn" id="up">‹ 上へ</button><span class="note">チェックしたフォルダの下は、全部「写真」に並びます</span></div>':'<p class="pad note">見たいフォルダに、チェックを付けます。チェックしたフォルダの下は、全部「写真」に並びます。</p>')+
      fs.map((f,i)=>'<div class="row"><input type="checkbox" data-c="'+i+'" aria-label="写真に含める"'+(cfg.folders.includes(full(f.name))?' checked':'')+'><button class="name" data-o="'+i+'">📁 '+esc(f.name)+'</button></div>').join('')+
      (fs.length?'':'<p class="pad note">これより下に、フォルダはありません。</p>');
    const up=$('#up');if(up)up.onclick=()=>{browse=browse.split('/').slice(0,-1).join('/')||'/';renderFolders()};
    main.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{browse=full(fs[+b.dataset.o].name);renderFolders()});
    main.querySelectorAll('[data-c]').forEach(b=>b.onchange=()=>{
      const p=full(fs[+b.dataset.c].name);
      cfg.folders=b.checked?cfg.folders.concat(p):cfg.folders.filter(x=>x!==p);
      S.set('folders',JSON.stringify(cfg.folders));loaded=false;ffolder=-1;
    });
  }catch(e){main.innerHTML='<div class="pad"><p>失敗しました：'+esc(e.message)+'</p></div>'}
}

// ---------- 設定 ----------
function renderSettings(){
  $('#title').textContent='設定';$('#count').textContent='';
  main.innerHTML='<div class="pad"><p class="note">見るフォルダ：<br>'+(cfg.folders.length?cfg.folders.map(esc).join('<br>'):'なし')+'</p>'+
    '<p>pCloud アプリの Client ID<br><input type="text" id="cid" value="'+esc(cfg.clientId)+'"></p>'+
    '<p><button class="btn main" id="go">pCloudにログインする</button> <button class="btn" id="out">ログアウト</button></p>'+
    '<p><button class="btn" id="clr">見るフォルダを全部解除</button></p>'+
    '<p class="note">ログインは pCloud の画面で行います。パスワードは、このページでは入力しません。ログイン情報は、この端末のブラウザの中にだけ残ります。</p></div>';
  $('#go').onclick=()=>{cfg.clientId=$('#cid').value.trim();S.set('cid',cfg.clientId);login()};
  $('#out').onclick=logout;
  $('#clr').onclick=()=>{cfg.folders=[];S.set('folders','[]');loaded=false;renderSettings()};
}

// ---------- 全体 ----------
function render(){
  setNav();
  if(!cfg.token&&tab!=='settings'){
    $('#title').textContent='ログイン';$('#count').textContent='';
    main.innerHTML='<div class="pad"><p>pCloudにログインします。</p><p><button class="btn main" id="go2">pCloudにログインする</button></p><p class="note">ログインは pCloud の画面で行います。パスワードは、このページでは入力しません。</p></div>';
    $('#go2').onclick=login;return;
  }
  if(tab==='photos')renderPhotos();
  else if(tab==='folders')renderFolders();
  else renderSettings();
}
tab=cfg.folders.length?'photos':'folders';
render();
