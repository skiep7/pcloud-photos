<!doctype html>
<html lang="ja">
<head>
<meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>pCloud写真</title>
<style>
:root{--bg:#fff;--panel:#f4f5f6;--fg:#1a1d20;--sub:#6b7680;--line:#dde1e4;--acc:#0a7cff;--accfg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#101214;--panel:#1a1d20;--fg:#eceff1;--sub:#98a2aa;--line:#2b3136;--acc:#4da3ff;--accfg:#08131f}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Hiragino Sans","Yu Gothic",sans-serif;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-height:48px}
header h1{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header span{color:var(--sub);font-size:13px;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:0 0 12px}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{font:inherit;font-size:14px;border:0;background:none;color:var(--sub);padding:12px 4px}
nav button[aria-current="true"]{color:var(--acc);font-weight:600}
button{font:inherit}
.btn{border:1px solid var(--line);background:none;color:var(--acc);border-radius:8px;padding:8px 14px}
.btn.main{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.pad{padding:12px 16px}
.note{color:var(--sub);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
.chips button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:999px;padding:2px 12px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding-top:10px}
.grid .c{aspect-ratio:1;position:relative;overflow:hidden;background:var(--panel);border:0;padding:0}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;right:3px;bottom:3px;background:#000b;color:#fff;font-size:11px;padding:0 5px;border-radius:4px}
.row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.row input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.row button.name{flex:1;min-width:0;text-align:left;border:0;background:none;color:var(--fg);padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--sub)}
input[type=text]{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#viewer{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:10}
#viewer img,#viewer video{max-width:100%;max-height:100%}
#viewer .x,#viewer .p,#viewer .n{position:absolute;background:#0008;color:#fff;border:0;border-radius:999px;width:44px;height:44px;font-size:20px}
#viewer .x{top:calc(12px + env(safe-area-inset-top,0px));right:12px}
#viewer .p{left:8px;top:50%}
#viewer .n{right:8px;top:50%}
#viewer .t{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:12px}
</style>
</head>
<body>
<header><h1 id="title">pCloud写真</h1><span id="count"></span></header>
<main id="main"></main>
<nav>
  <button id="t-photos">写真</button>
  <button id="t-folders">フォルダ</button>
  <button id="t-settings">設定</button>
</nav>
<div id="viewer"><button class="x" id="vx" aria-label="閉じる">✕</button><button class="p" id="vp" aria-label="前へ">‹</button><button class="n" id="vn" aria-label="次へ">›</button><div class="t" id="vt"></div></div>

<script>
// ---------- 保存（このブラウザの中だけ） ----------
const S={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let cfg={clientId:S.get('cid','p3yyOitV43F'),token:S.get('tok',''),host:S.get('host','api.pcloud.com'),folders:[]};
try{cfg.folders=JSON.parse(S.get('folders','[]'))||[]}catch(e){cfg.folders=[]}
const $=s=>document.querySelector(s), main=$('#main');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- ログイン（パスワードは、このページでは扱わない） ----------
if(location.hash.includes('access_token')){
  const p=new URLSearchParams(location.hash.slice(1));
  S.set('tok',p.get('access_token')||'');S.set('host',p.get('hostname')||'api.pcloud.com');
  cfg.token=S.get('tok');cfg.host=S.get('host');history.replaceState(null,'',location.pathname);
}
function login(){
  const redirect=location.origin+location.pathname;
  location.href='https://my.pcloud.com/oauth2/authorize?client_id='+encodeURIComponent(cfg.clientId)+'&response_type=token&redirect_uri='+encodeURIComponent(redirect);
}
function logout(){S.set('tok','');cfg.token='';go('settings')}

// ---------- API ----------
async function api(method,params){
  const u=new URL('https://'+cfg.host+'/'+method);
  u.searchParams.set('access_token',cfg.token);
  for(const k in params)u.searchParams.set(k,params[k]);
  const r=await (await fetch(u,{referrerPolicy:'no-referrer'})).json();
  if(r.result!==0){const e=new Error(r.error||('error '+r.result));e.code=r.result;throw e}
  return r;
}
const IMG=/\.(heic|heif|jpe?g|png|gif|webp)$/i, VID=/\.(mov|mp4|m4v)$/i;
function kind(f){ if(f.category===1||IMG.test(f.name))return 'i'; if(f.category===2||VID.test(f.name))return 'v'; return ''; }

// ---------- 状態 ----------
let tab='photos', items=[], loaded=false, loading=false, loadErr='';
let ftype='all', ffolder=-1, shown=60, list=[];
let browse='/', thumbs=new Map();

function go(t){tab=t;render()}
$('#t-photos').onclick=()=>go('photos');$('#t-folders').onclick=()=>go('folders');$('#t-settings').onclick=()=>go('settings');
function setNav(){['photos','folders','settings'].forEach(t=>$('#t-'+t).setAttribute('aria-current',String(tab===t)))}

// ---------- 写真（選んだフォルダの下を、全部まとめて） ----------
async function loadAll(){
  loading=true;loadErr='';items=[];loaded=false;render();
  try{
    for(let fi=0;fi<cfg.folders.length;fi++){
      $('#count').textContent='読み込み中 '+(fi+1)+'/'+cfg.folders.length;
      const r=await api('listfolder',{path:cfg.folders[fi],recursive:1});
      (function walk(c){(c||[]).forEach(f=>{
        if(f.isfolder)walk(f.contents);
        else{const k=kind(f);if(k)items.push({id:f.fileid,name:f.name,t:Date.parse(f.modified)||0,v:k==='v',fi})}
      })})(r.metadata.contents);
    }
    items.sort((a,b)=>b.t-a.t);loaded=true;
  }catch(e){loadErr=e.message;if([1000,2000,2094,2095].includes(e.code)){S.set('tok','');cfg.token=''}}
  loading=false;shown=60;render();
}
function renderPhotos(){
  $('#title').textContent='写真';
  if(!cfg.folders.length){main.innerHTML='<div class="pad"><p>見るフォルダが、まだ選ばれていません。</p><p><button class="btn main" id="gof">フォルダを選ぶ</button></p></div>';$('#gof').onclick=()=>go('folders');$('#count').textContent='';return}
  if(loading){main.innerHTML='<p class="pad note">読み込み中…（枚数が多いと、少しかかります）</p>';return}
  if(loadErr){main.innerHTML='<div class="pad"><p>失敗しました：'+esc(loadErr)+'</p><p><button class="btn" id="retry">もう一度</button> <button class="btn" id="gos">設定へ</button></p></div>';$('#retry').onclick=loadAll;$('#gos').onclick=()=>go('settings');return}
  if(!loaded){loadAll();return}
  const inF=items.filter(i=>ffolder<0||i.fi===ffolder);
  const nImg=inF.filter(i=>!i.v).length, nVid=inF.length-nImg;
  $('#count').textContent='写真 '+nImg+'枚・動画 '+nVid+'本';
  list=inF.filter(i=>ftype==='all'||(ftype==='v'?i.v:!i.v));
  const chips='<div class="chips">'+
    [['all','すべて'],['i','写真'],['v','動画']].map(a=>'<button data-ty="'+a[0]+'" aria-pressed="'+(ftype===a[0])+'">'+a[1]+'</button>').join('')+
    (cfg.folders.length>1?'<button data-fo="-1" aria-pressed="'+(ffolder<0)+'">全フォルダ</button>'+cfg.folders.map((p,i)=>'<button data-fo="'+i+'" aria-pressed="'+(ffolder===i)+'">'+esc(p.split('/').pop()||p)+'</button>').join(''):'')+'</div>';
  const part=list.slice(0,shown);
  main.innerHTML=chips+'<div class="grid">'+part.map((t,i)=>'<button class="c" data-i="'+i+'" aria-label="'+(t.v?'動画':'写真')+'"><span></span>'+(t.v?'<span class="badge">▶</span>':'')+'</button>').join('')+'</div>'+
    (list.length>shown?'<div class="pad"><button class="btn" id="more">もっと見る（残り '+(list.length-shown)+'）</button></div>':'')+
    (list.length?'':'<p class="pad note">該当するものがありません。</p>');
  main.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{ftype=b.dataset.ty;shown=60;render()});
  main.querySelectorAll('[data-fo]').forEach(b=>b.onclick=()=>{ffolder=+b.dataset.fo;shown=60;render()});
  main.querySelectorAll('.c').forEach(b=>b.onclick=()=>openViewer(+b.dataset.i));
  const m=$('#more');
  if(m){
    m.onclick=()=>{shown+=60;render()};
    // 下までスクロールしたら、自動で続きを読む
    const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)&&tab==='photos'){io.disconnect();shown+=60;render()}},{rootMargin:'600px'});
    io.observe(m);
  }
  fillThumbs(part);
}
async function fillThumbs(part){
  const need=part.filter(t=>!thumbs.has(t.id)).map(t=>t.id);
  const apply=()=>main.querySelectorAll('.c').forEach(b=>{const t=list[+b.dataset.i];const u=t&&thumbs.get(t.id);if(u&&!b.querySelector('img'))b.firstChild.outerHTML='<img loading="lazy" alt="" src="'+u+'">'});
  apply();
  for(let i=0;i<need.length;i+=50){
    try{
      const r=await api('getthumbslinks',{fileids:need.slice(i,i+50).join(','),size:'512x512',crop:1,type:'jpg'});
      (r.thumbs||[]).forEach(t=>{if(t.result===0&&t.hosts&&t.hosts.length)thumbs.set(t.fileid,'https://'+t.hosts[0]+t.path)});
      apply();
    }catch(e){}
  }
}

// ---------- 全画面で見る ----------
let vi=0;
async function openViewer(i){
  vi=i;const t=list[i];if(!t)return;
  const v=$('#viewer');v.style.display='flex';
  v.querySelectorAll('img,video').forEach(e=>e.remove());
  $('#vt').textContent=(i+1)+' / '+list.length+'　'+t.name;
  try{
    let url;
    if(t.v){
      // pCloudは、よそのサイトからの動画リンクを断るので、中継役（Cloudflare Worker）を通す
      url='https://pcloud-photos-proxy.cyber-skiep.workers.dev/video?host='+encodeURIComponent(cfg.host)+'&token='+encodeURIComponent(cfg.token)+'&fileid='+t.id;
    }else{
      const r=await api('getthumbslinks',{fileids:t.id,size:'2048x1024',type:'jpg'});
      const th=(r.thumbs||[])[0];
      if(!th||th.result!==0)throw new Error((th&&th.error)||'リンクが取れません');
      url='https://'+th.hosts[0]+th.path;
    }
    if(vi!==i)return;
    const el=document.createElement(t.v?'video':'img');
    el.referrerPolicy='no-referrer';el.src=url;if(t.v){el.controls=true;el.playsInline=true;el.autoplay=true}
    v.insertBefore(el,v.firstChild);
  }catch(e){$('#vt').textContent='読み込めませんでした：'+e.message}
}
function closeViewer(){const v=$('#viewer');v.querySelectorAll('video').forEach(e=>e.pause());v.querySelectorAll('img,video').forEach(e=>e.remove());v.style.display='none'}
$('#vx').onclick=closeViewer;
$('#vp').onclick=()=>{if(vi>0)openViewer(vi-1)};
$('#vn').onclick=()=>{if(vi<list.length-1)openViewer(vi+1)};
document.addEventListener('keydown',e=>{if($('#viewer').style.display==='flex'){if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')$('#vp').click();if(e.key==='ArrowRight')$('#vn').click()}});

// ---------- フォルダ（見るフォルダの選択） ----------
async function renderFolders(){
  $('#title').textContent=browse==='/'?'フォルダ':browse.split('/').pop();
  $('#count').textContent='';
  main.innerHTML='<p class="pad note">読み込み中…</p>';
  try{
    const r=await api('listfolder',{path:browse,nofiles:1});
    const fs=(r.metadata.contents||[]).filter(f=>f.isfolder).sort((a,b)=>a.name.localeCompare(b.name));
    const full=n=>(browse==='/'?'':browse)+'/'+n;
    main.innerHTML=(browse!=='/'?'<div class="row"><button class="btn" id="up">‹ 上へ</button><span class="note">チェックしたフォルダの下は、全部「写真」に並びます</span></div>':'<p class="pad note">見たいフォルダに、チェックを付けます。チェックしたフォルダの下は、全部「写真」に並びます。</p>')+
      fs.map((f,i)=>'<div class="row"><input type="checkbox" data-c="'+i+'" aria-label="写真に含める"'+(cfg.folders.includes(full(f.name))?' checked':'')+'><button class="name" data-o="'+i+'">📁 '+esc(f.name)+'</button></div>').join('')+
      (fs.length?'':'<p class="pad note">これより下に、フォルダはありません。</p>');
    const up=$('#up');if(up)up.onclick=()=>{browse=browse.split('/').slice(0,-1).join('/')||'/';renderFolders()};
    main.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{browse=full(fs[+b.dataset.o].name);renderFolders()});
    main.querySelectorAll('[data-c]').forEach(b=>b.onchange=()=>{
      const p=full(fs[+b.dataset.c].name);
      cfg.folders=b.checked?cfg.folders.concat(p):cfg.folders.filter(x=>x!==p);
      S.set('folders',JSON.stringify(cfg.folders));loaded=false;ffolder=-1;
    });
  }catch(e){main.innerHTML='<div class="pad"><p>失敗しました：'+esc(e.message)+'</p></div>'}
}

// ---------- 設定 ----------
function renderSettings(){
  $('#title').textContent='設定';$('#count').textContent='';
  main.innerHTML='<div class="pad"><p class="note">見るフォルダ：<br>'+(cfg.folders.length?cfg.folders.map(esc).join('<br>'):'なし')+'</p>'+
    '<p>pCloud アプリの Client ID<br><input type="text" id="cid" value="'+esc(cfg.clientId)+'"></p>'+
    '<p><button class="btn main" id="go">pCloudにログインする</button> <button class="btn" id="out">ログアウト</button></p>'+
    '<p><button class="btn" id="clr">見るフォルダを全部解除</button></p>'+
    '<p class="note">ログインは pCloud の画面で行います。パスワードは、このページでは入力しません。ログイン情報は、この端末のブラウザの中にだけ残ります。</p></div>';
  $('#go').onclick=()=>{cfg.clientId=$('#cid').value.trim();S.set('cid',cfg.clientId);login()};
  $('#out').onclick=logout;
  $('#clr').onclick=()=>{cfg.folders=[];S.set('folders','[]');loaded=false;renderSettings()};
}

// ---------- 全体 ----------
function render(){
  setNav();
  if(!cfg.token&&tab!=='settings'){
    $('#title').textContent='ログイン';$('#count').textContent='';
    main.innerHTML='<div class="pad"><p>pCloudにログインします。</p><p><button class="btn main" id="go2">pCloudにログインする</button></p><p class="note">ログインは pCloud の画面で行います。パスワードは、このページでは入力しません。</p></div>';
    $('#go2').onclick=login;return;
  }
  if(tab==='photos')renderPhotos();
  else if(tab==='folders')renderFolders();
  else renderSettings();
}
tab=cfg.folders.length?'photos':'folders';
render();
</script>
</body>
</html>
